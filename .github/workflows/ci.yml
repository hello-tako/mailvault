name: CI

# `verify` is the gate: it runs the same commands the README claims are green. `deploy`
# is manual-only and ships exactly what `verify` built, so a deploy can never publish
# source nobody tested.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm -r test

      # The E2E suite serves the built SPA from the Worker's static-asset binding, so the
      # bundle under test is the bundle that would ship.
      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      - name: Build SPA
        run: pnpm build:web

      - name: Worker dry-run
        run: pnpm --filter @mailvault/worker build

      - name: Install Playwright browser
        run: pnpm --filter @mailvault/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: apps/web
        # Started here rather than through `pnpm test:e2e` because that script also
        # rebuilds the SPA, and the bundle built above is the one under test.
        run: npx playwright test --reporter=line

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: apps/web/dist

      # Wrangler reads the token from the environment; it is never written to a file, a
      # log line or the D1 database. See SECURITY.md §2.
      - name: Read-only production schema gate
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-schema.mjs --remote

      - name: Deploy Worker + SPA
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --outdir /tmp/mv-dist --minify

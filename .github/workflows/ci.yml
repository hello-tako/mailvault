name: CI

# `verify` is the gate: it runs the same commands the README claims are green. `deploy`
# ships exactly what `verify` built — on merge to main automatically (CI already proved
# it, and migrations are applied in the job before the code lands), or by manual dispatch
# when the owner wants a hand on the wheel. The `production` environment can still be
# given reviewers in GitHub settings to turn auto-deploy back into an approval.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm -r test

      # The E2E suite serves the built SPA from the Worker's static-asset binding, so the
      # bundle under test is the bundle that would ship.
      - name: Build SPA
        run: pnpm build:web

      - name: Install Playwright browser
        run: pnpm --filter @mailvault/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: apps/web
        # Started here rather than through `pnpm test:e2e` because that script also
        # rebuilds the SPA, and the bundle built above is the one under test.
        run: npx playwright test --reporter=line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  deploy:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # Migrations are additive and run before the code that expects them lands, so a
      # deploy can never publish a Worker against yesterday's schema. This is the step
      # DEPLOYMENT.md used to ask the owner to remember by hand before every deploy.
      - name: Apply D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mail-vault-db --config wrangler.jsonc --remote

      # Wrangler reads the token from the environment; it is never written to a file, a
      # log line or the D1 database. See SECURITY.md §2. The token in GitHub secrets is a
      # separate CI credential (Workers/D1/Queues), not the Worker's runtime secret.
      - name: Deploy Worker + SPA
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --outdir /tmp/mv-dist --minify

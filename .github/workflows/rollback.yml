name: Roll back production

# Pin 100% of traffic back to a Worker version that is already known good. This does not
# rebuild anything: it points production at an uploaded version, which is what makes it
# usable at 2am when the current build is the problem.

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Worker version id to roll back to (see `wrangler versions list`)"
        required: true
        type: string
      acknowledge_production_rollback:
        description: "I understand this will immediately send 100% of production traffic to the selected Worker version."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-mail-vault
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate operator acknowledgement and version id
        env:
          ACKNOWLEDGE: ${{ inputs.acknowledge_production_rollback }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          test "$ACKNOWLEDGE" = "true" || { echo "Rollback requires explicit operator acknowledgement." >&2; exit 1; }
          printf '%s\n' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

      - name: Recent versions
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions list --config wrangler.jsonc --json > /tmp/versions.json
          node -e '
            const v = require("/tmp/versions.json");
            for (const x of v.slice(0, 10)) console.log(x.id, x.number, x.metadata?.created_on);
          '

      - name: Pin production to the requested version
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACKNOWLEDGE: ${{ inputs.acknowledge_production_rollback }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          test "$ACKNOWLEDGE" = "true"
          printf '%s\n' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          npx wrangler versions deploy \
            --config wrangler.jsonc \
            --version-id "$VERSION_ID" \
            --percentage 100 \
            --message "rollback ${{ github.actor }} via CI" \
            --yes

      - name: Confirm what is live
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments status --config wrangler.jsonc
